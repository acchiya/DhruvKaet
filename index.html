<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dhruvkaat</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100vw; max-height: 100vh; image-rendering: pixelated; }
  </style>
</head>
<body>
  <script src="lib/phaser.min.js"></script>
  <script>
    // Load game scripts with a fresh ?v= each time so the browser never runs stale code after a git pull.
    (function load(files) {
      if (!files.length) return;
      const s = document.createElement('script');
      s.src = files[0] + '?v=' + Date.now();
      s.onload = () => load(files.slice(1));
      document.body.appendChild(s);
    })(['src/assets.js', 'src/data.js', 'src/art.js', 'src/theme.js', 'src/terrain.js', 'src/controls.js', 'src/main.js']);
  </script>
</body>
</html>
